<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>נחש מי? - מערכת חדרים</title>
    <style>
        body { font-family: sans-serif; background: #1e3c72; color: white; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; color: #333; padding: 20px; border-radius: 15px; width: 100%; max-width: 600px; }
        .room-section { text-align: center; }
        input { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #game-area { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- מסך כניסה לחדר -->
        <div id="room-section" class="room-section">
            <h1>ברוכים הבאים ל"נחש מי?"</h1>
            <input type="text" id="room-code" placeholder="הכנס קוד חדר (למשל: EitanHouse)">
            <br>
            <button onclick="enterRoom()">היכנס לחדר</button>
        </div>

        <!-- אזור המשחק -->
        <div id="game-area">
            <h2 id="room-display"></h2>
            <div id="chat-box" style="height: 200px; border: 1px solid #ccc; overflow-y: scroll; margin-bottom: 10px; padding: 5px;"></div>
            <input type="text" id="msg-input" placeholder="כתוב הודעה...">
            <button onclick="sendMessage()">שלח והעבר תור</button>
            <p id="turn-status"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({ databaseURL: "https://nahesh-mi-default-rtdb.firebaseio.com" });
        let db = firebase.database();
        let roomRef, myRole;

        function enterRoom() {
            const code = document.getElementById('room-code').value.trim();
            if(!code) return alert("חובה להכניס קוד!");
            
            document.getElementById('room-section').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('room-display').innerText = "חדר: " + code;

            // יצירת נתיב ייחודי לחדר
            roomRef = db.ref('rooms/' + code);

            // קביעת תפקיד (שחקן ראשון שנכנס הוא p1, שני הוא p2)
            roomRef.transaction(function(room) {
                if (!room) {
                    return { p1: true, currentTurn: 'p1', turnCount: 0 };
                }
                if (!room.p2) {
                    return { ...room, p2: true };
                }
                return room;
            }, function(error, committed, snapshot) {
                myRole = snapshot.child('p2').exists() ? 'p2' : 'p1';
                listenToGame();
            });
        }

        function listenToGame() {
            roomRef.on('value', snap => {
                const data = snap.val();
                document.getElementById('chat-box').innerHTML = '';
                if(data.messages) {
                    Object.values(data.messages).forEach(m => {
                        document.getElementById('chat-box').innerHTML += `<p><b>${m.sender}:</b> ${m.text}</p>`;
                    });
                }
                
                const isMyTurn = data.currentTurn === myRole;
                document.getElementById('turn-status').innerText = isMyTurn ? "זה תורך!" : "מחכה ליריב...";
                document.getElementById('msg-input').disabled = !isMyTurn;
            });
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const nextTurn = myRole === 'p1' ? 'p2' : 'p1';
            
            roomRef.child('messages').push({ sender: myRole, text: input.value });
            roomRef.update({ currentTurn: nextTurn, turnCount: firebase.database.ServerValue.INCREMENT });
            input.value = '';
        }
    </script>
</body>
</html>
