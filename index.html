<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>נחש מי? - המשחק המלא</title>
    <style>
        body { font-family: sans-serif; background: #1e3c72; color: #333; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 900px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 20px 0; }
        .card { border: 2px solid #ccc; padding: 10px; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .card:hover { border-color: #3b82f6; }
        .eliminated { opacity: 0.2; transform: scale(0.9); }
        .hidden { display: none; }
        .chat { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; text-align: right; }
        button { cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="room-setup">
        <h1>נחש מי? - חדרים</h1>
        <input type="text" id="room-code" placeholder="שם חדר...">
        <button onclick="enterRoom()" style="padding: 5px 15px;">היכנס</button>
    </div>

    <div id="character-selection" class="hidden">
        <h2>בחר את הדמות שלך</h2>
        <div id="select-grid" class="grid"></div>
    </div>

    <div id="game-play" class="hidden">
        <h2 id="room-title"></h2>
        <div style="display: flex; gap: 20px;">
            <div style="flex: 2;">
                <h3>הלוח שלך</h3>
                <div id="board-grid" class="grid"></div>
                <select id="guess-select" style="padding: 5px;"></select>
                <button onclick="makeGuess()" style="background: red; color: white; padding: 5px 10px; border: none; border-radius: 5px;">בצע ניחוש סופי!</button>
            </div>
            <div style="flex: 1;">
                <div id="chat" class="chat"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="msg-input" placeholder="שאל/ענה..." style="flex: 1; padding: 5px;">
                    <button onclick="sendMessage()" style="padding: 5px 10px;">שלח</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({ databaseURL: "https://nahesh-mi-default-rtdb.firebaseio.com" });
    const db = firebase.database();
    
    // רשימת הדמויות המעודכנת לפי התמונה שנשלחה
    const CHARS = [
        {n:"הילה", e:"👩🏻"}, {n:"ירין", e:"👨🏻"}, {n:"ריי", e:"👨🏼"}, {n:"אורי", e:"👨🏽"}, 
        {n:"לי-אור", e:"👩🏼"}, {n:"איתן", e:"👨🏻"}, {n:"רני", e:"👨🏼"}, {n:"נעמי", e:"👩🏽"}, 
        {n:"יותם", e:"👨🏻"}, {n:"אלחנן", e:"👨🏽"}, {n:"עומר", e:"👨🏼"}, {n:"איילה", e:"👩🏻"}, 
        {n:"יובל", e:"👨🏻"}, {n:"מירי", e:"👩🏼"}, {n:"תבור", e:"👨🏽"}, {n:"אריאל", e:"👨🏻"}, 
        {n:"אילי", e:"👨🏼"}, {n:"עמית", e:"👨🏻"}, {n:"נועם", e:"👨🏽"}
    ];

    let roomRef, myRole, roomCode;

    function enterRoom() {
        roomCode = document.getElementById('room-code').value.trim();
        if (!roomCode) return alert("אנא הכנס שם חדר");
        
        roomRef = db.ref('rooms/' + roomCode);
        document.getElementById('room-setup').classList.add('hidden');
        document.getElementById('character-selection').classList.remove('hidden');
        
        const grid = document.getElementById('select-grid');
        grid.innerHTML = ''; 
        CHARS.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `${c.e}<br>${c.n}`;
            div.onclick = () => selectMyCharacter(c.n);
            grid.appendChild(div);
        });

        roomRef.on('value', s => {
            const data = s.val();
            if(data && data.messages) {
                const chat = document.getElementById('chat');
                chat.innerHTML = Object.values(data.messages).map(m => {
                    const senderName = m.sender === 'p1' ? 'שחקן 1' : (m.sender === 'p2' ? 'שחקן 2' : 'אורח');
                    return `<p style="margin: 5px 0;"><b>${senderName}:</b> ${m.text}</p>`;
                }).join('');
                chat.scrollTop = chat.scrollHeight; 
            }
        });
    }

    function selectMyCharacter(name) {
        roomRef.transaction(room => {
            if(!room) {
                return { p1: {char: name}, currentTurn: 'p1' };
            }
            if(!room.p2) {
                room.p2 = {char: name};
                return room;
            }
            return room;
        }, (error, committed, snapshot) => {
            if (error) {
                console.error("שגיאת התחברות לחדר:", error);
                alert("שגיאה! האם פתחת את הרשאות ה-Rules בפיירבייס?");
                return;
            }
            
            const data = snapshot.val();
            if (data && data.p1 && data.p1.char === name && (!data.p2 || data.p2.char !== name)) {
                myRole = 'p1';
            } else {
                myRole = 'p2';
            }

            document.getElementById('character-selection').classList.add('hidden');
            document.getElementById('game-play').classList.remove('hidden');
            document.getElementById('room-title').innerText = "חדר: " + roomCode;
            initBoard();
        });
    }

    function initBoard() {
        const grid = document.getElementById('board-grid');
        const select = document.getElementById('guess-select');
        grid.innerHTML = '';
        select.innerHTML = '';
        CHARS.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `${c.e}<br>${c.n}`;
            div.onclick = function() { this.classList.toggle('eliminated'); };
            grid.appendChild(div);
            select.innerHTML += `<option value="${c.n}">${c.n}</option>`;
        });
    }

    function sendMessage() {
        const msgInput = document.getElementById('msg-input');
        const msg = msgInput.value.trim();
        if (!msg) return; 
        
        const sender = myRole || 'unknown'; 
        
        roomRef.child('messages').push({sender: sender, text: msg})
            .then(() => {
                roomRef.once('value', s => {
                    const data = s.val();
                    if(data && data.currentTurn) {
                        roomRef.update({currentTurn: data.currentTurn === 'p1' ? 'p2' : 'p1'});
                    }
                });
                msgInput.value = '';
            })
            .catch(error => {
                console.error("שגיאה בשליחת הודעה:", error);
                alert("לא הצלחנו לשלוח את ההודעה. בדוק את חיבור האינטרנט או הרשאות הפיירבייס.");
            });
    }

    function makeGuess() {
        const guess = document.getElementById('guess-select').value;
        roomRef.once('value', s => {
            const data = s.val();
            if (!data) return;
            
            const opponent = myRole === 'p1' ? 'p2' : 'p1';
            if(!data[opponent]) {
                alert("השחקן השני טרם בחר דמות!");
                return;
            }
            
            if(data[opponent].char === guess) {
                alert("🎉 ניצחת! הדמות הייתה " + guess);
            } else {
                alert("❌ טעות! הדמות הייתה " + data[opponent].char);
            }
        });
    }
</script>
</body>
</html>
