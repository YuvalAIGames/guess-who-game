<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>נחש מי? - המשחק המלא</title>
    <style>
        body { font-family: sans-serif; background: #1e3c72; color: #333; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 900px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 20px 0; }
        .card { border: 2px solid #ccc; padding: 10px; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .card:hover { border-color: #3b82f6; }
        .eliminated { opacity: 0.2; transform: scale(0.9); }
        .hidden { display: none; }
        .chat { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- שלב 1: כניסה לחדר -->
    <div id="room-setup">
        <h1>נחש מי? - חדרים</h1>
        <input type="text" id="room-code" placeholder="שם חדר...">
        <button onclick="enterRoom()">היכנס</button>
    </div>

    <!-- שלב 2: בחירת דמות -->
    <div id="character-selection" class="hidden">
        <h2>בחר את הדמות שלך</h2>
        <div id="select-grid" class="grid"></div>
    </div>

    <!-- שלב 3: משחק -->
    <div id="game-play" class="hidden">
        <h2 id="room-title"></h2>
        <div style="display: flex; gap: 20px;">
            <div style="flex: 2;">
                <h3>הלוח שלך</h3>
                <div id="board-grid" class="grid"></div>
                <select id="guess-select"></select>
                <button onclick="makeGuess()" style="background: red; color: white;">בצע ניחוש סופי!</button>
            </div>
            <div style="flex: 1;">
                <div id="chat" class="chat"></div>
                <input type="text" id="msg-input" placeholder="שאל/ענה...">
                <button onclick="sendMessage()">שלח</button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({ databaseURL: "https://nahesh-mi-default-rtdb.firebaseio.com" });
    const db = firebase.database();
    
    const CHARS = [
        {n:"אלכס", e:"👨🏻"}, {n:"אניטה", e:"👩🏼"}, {n:"ברנרד", e:"👨🏽"}, {n:"צ'ארלס", e:"👱🏼"}, 
        {n:"קלייר", e:"👩🏻"}, {n:"דויד", e:"👱🏼"}, {n:"אריק", e:"👨🏼"}, {n:"פראנס", e:"👨🏻"}, 
        {n:"ג'ורג'", e:"👴🏻"}, {n:"הרמן", e:"👨🏻"}, {n:"ג'ו", e:"👱🏼"}, {n:"מריה", e:"👩🏽"}, 
        {n:"מקס", e:"👨🏻"}, {n:"פול", e:"👴🏻"}, {n:"פיטר", e:"👴🏻"}, {n:"פיליפ", e:"👨🏻"}, 
        {n:"ריצ'רד", e:"👨🏽"}, {n:"רוברט", e:"👨🏽"}, {n:"סם", e:"👴🏻"}, {n:"סוזן", e:"👵🏻"}, 
        {n:"טום", e:"👨🏻"}, {n:"ליאו", e:"👨🏽"}, {n:"מייק", e:"👨🏽"}, {n:"נינה", e:"👩🏼"}
    ];

    let roomRef, myRole, roomCode;

    function enterRoom() {
        roomCode = document.getElementById('room-code').value;
        roomRef = db.ref('rooms/' + roomCode);
        document.getElementById('room-setup').classList.add('hidden');
        document.getElementById('character-selection').classList.remove('hidden');
        
        const grid = document.getElementById('select-grid');
        CHARS.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `${c.e}<br>${c.n}`;
            div.onclick = () => selectMyCharacter(c.n);
            grid.appendChild(div);
        });
    }

    function selectMyCharacter(name) {
        roomRef.transaction(room => {
            if(!room) room = { p1: {char: name}, currentTurn: 'p1' };
            else if(!room.p2) room.p2 = {char: name};
            return room;
        }, () => {
            myRole = !roomRef.child('p2').get ? 'p1' : 'p2'; // פישוט לוגיקה
            document.getElementById('character-selection').classList.add('hidden');
            document.getElementById('game-play').classList.remove('hidden');
            initBoard();
        });
    }

    function initBoard() {
        const grid = document.getElementById('board-grid');
        const select = document.getElementById('guess-select');
        CHARS.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `${c.e}<br>${c.n}`;
            div.onclick = function() { this.classList.toggle('eliminated'); };
            grid.appendChild(div);
            select.innerHTML += `<option value="${c.n}">${c.n}</option>`;
        });
    }

    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        roomRef.child('messages').push({sender: myRole, text: msg});
        // החלפת תור
        roomRef.once('value', s => {
            roomRef.update({currentTurn: s.val().currentTurn === 'p1' ? 'p2' : 'p1'});
        });
        document.getElementById('msg-input').value = '';
    }

    function makeGuess() {
        const guess = document.getElementById('guess-select').value;
        roomRef.once('value', s => {
            const opponent = myRole === 'p1' ? 'p2' : 'p1';
            if(s.val()[opponent].char === guess) alert("ניצחת! הדמות הייתה " + guess);
            else alert("טעות! הדמות הייתה " + s.val()[opponent].char);
        });
    }

    roomRef.on('value', s => {
        const data = s.val();
        if(data.messages) {
            const chat = document.getElementById('chat');
            chat.innerHTML = Object.values(data.messages).map(m => `<p><b>${m.sender}:</b> ${m.text}</p>`).join('');
        }
    });
</script>
</body>
</html>
