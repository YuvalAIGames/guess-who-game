<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נחש מי? - עם צ'אט חי</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 { color: #1e3c72; margin-bottom: 10px; font-size: 2.5em; }
        .scoreboard {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            justify-content: space-around;
            border: 2px solid #cbd5e1;
        }
        .game-section { display: none; }
        .game-section.active { display: block; animation: fadeIn 0.5s ease; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Board layout with Chat */
        .playing-layout {
            display: flex;
            gap: 20px;
            text-align: right;
            align-items: stretch;
        }
        @media (max-width: 768px) {
            .playing-layout { flex-direction: column; }
        }
        .board-col { flex: 2; }
        
        /* Chat Styling */
        .chat-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            overflow: hidden;
            height: 60vh;
            min-height: 400px;
        }
        .chat-header {
            background: #3b82f6; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2em;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            padding: 10px 15px; border-radius: 15px; max-width: 85%; word-break: break-word; font-size: 0.95em;
        }
        .message.mine {
            align-self: flex-start; background: #dbeafe; color: #1e3b8a; border-bottom-right-radius: 2px;
        }
        .message.theirs {
            align-self: flex-end; background: #e2e8f0; color: #334155; border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex; flex-direction: column; gap: 8px; padding: 15px; background: white; border-top: 1px solid #cbd5e1;
        }
        .chat-row { display: flex; gap: 8px; }
        .chat-row input {
            flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1em; outline: none;
        }
        .chat-row input:focus { border-color: #3b82f6; }
        .chat-row button {
            padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .chat-row button:hover:not(:disabled) { background: #2563eb; }
        .chat-row button:disabled, .chat-row input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .pass-turn-btn {
            background: #f59e0b; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em;
        }
        .pass-turn-btn:hover:not(:disabled) { background: #d97706; }
        .pass-turn-btn:disabled { background: #cbd5e1; cursor: not-allowed; color: #64748b; }

        /* Turn Indicator */
        .turn-indicator {
            font-size: 1.2em; font-weight: bold; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: center; transition: all 0.3s;
        }
        .my-turn { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
        .their-turn { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }

        /* Grid */
        .characters-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px;
            margin-bottom: 20px; max-height: 40vh; overflow-y: auto; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0;
        }
        .character-card {
            padding: 10px; border: 2px solid #94a3b8; background: white; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .character-card:hover { border-color: #3b82f6; background: #eff6ff; }
        .character-card.eliminated { opacity: 0.3; filter: grayscale(100%); transform: scale(0.95); border-color: #ef4444; }
        .char-emoji { font-size: 2.2em; margin-bottom: 5px; }
        .char-name { font-weight: bold; font-size: 1em; }
        .char-traits { font-size: 0.75em; color: #64748b; text-align: center; line-height: 1.2; margin-top: 5px;}

        .my-chosen-character {
            margin-bottom: 15px; padding: 10px; background: #dbeafe; border: 2px dashed #3b82f6; border-radius: 10px; font-weight: bold; color: #1e3b8a; text-align: center;
        }

        button.action-btn {
            width: 100%; max-width: 300px; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: block; margin: 10px auto;
        }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        button.danger-btn { background: #ef4444; }
        button.danger-btn:hover:not(:disabled) { background: #dc2626; }
        
        .role-btn { margin: 10px; padding: 15px 30px; font-size: 1.2em; background: #f59e0b; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .role-btn:hover { background: #d97706; }
        
        select.guess-select {
            width: 100%; max-width: 300px; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1em; margin-bottom: 10px; display: block; margin: 10px auto;
        }
        select.guess-select:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-box { padding: 20px; border-radius: 10px; font-size: 1.3em; font-weight: bold; margin-top: 20px; }
        .result-box.win { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
        .result-box.lose { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 נחש מי?</h1>
        
        <!-- Scoreboard -->
        <div class="scoreboard" id="scoreboard" style="display: none;">
            <div id="p1-score-display">שחקן 1: 0</div>
            <div id="round-display">ממתינים...</div>
            <div id="p2-score-display">שחקן 2: 0</div>
        </div>

        <!-- Role Selection -->
        <div class="game-section active" id="role-section">
            <h2>בחר את התפקיד שלך</h2>
            <p style="margin-bottom: 20px; color: #666;">כדי לשחק עם חבר, אחד מכם בוחר 'שחקן 1' והשני 'שחקן 2'.</p>
            <button class="role-btn" onclick="window.joinGame('p1')">כנס כשחקן 1</button>
            <button class="role-btn" onclick="window.joinGame('p2')">כנס כשחקן 2</button>
            <br><br>
            <button onclick="window.hardResetGame()" style="background:none; border:none; color:red; text-decoration:underline; cursor:pointer;">איפוס משחק מלא (מחיקת ניקוד)</button>
        </div>

        <!-- Phase 1: Choose Mystery Character -->
        <div class="game-section" id="choose-section">
            <h2>👤 בחר את הדמות המסתורית שלך</h2>
            <p style="margin-bottom: 15px;">בחר דמות אחת שהיריב יצטרך לנחש.</p>
            <div class="characters-grid" id="choose-grid"></div>
        </div>

        <!-- Wait Screen -->
        <div class="game-section" id="waiting-section">
            <h2 style="color: #475569; margin: 40px 0;" id="waiting-msg">ממתין שהשחקן השני יבחר דמות...</h2>
            <div style="font-size: 3em;">⏳</div>
        </div>

        <!-- Phase 2: Playing Board & Chat -->
        <div class="game-section" id="playing-section">
            <div class="playing-layout">
                
                <!-- Chat UI -->
                <div class="chat-col">
                    <div class="chat-header">💬 צ'אט ושאלות</div>
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages will load here -->
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-row">
                            <input type="text" id="chat-text-input" placeholder="הקלד שאלה או תשובה...">
                            <button id="chat-send-btn" onclick="window.sendMessage()">שלח</button>
                        </div>
                        <button id="chat-pass-btn" class="pass-turn-btn" onclick="window.passTurn()">סיים והעבר תור ליריב ➔</button>
                    </div>
                </div>

                <!-- Board UI -->
                <div class="board-col">
                    <div id="turn-indicator" class="turn-indicator"></div>
                    <div class="my-chosen-character" id="my-chosen-display"></div>
                    
                    <h3 style="margin-bottom:10px;">לוח הסינון שלך</h3>
                    <div class="characters-grid" id="play-grid"></div>

                    <div style="margin-top: 15px; padding-top: 15px; border-top: 2px solid #e2e8f0; text-align: center;">
                        <h4 style="color:red; margin-bottom: 5px;">זהירות: ניחוש שגוי מסיים את הסבב בהפסד!</h4>
                        <select id="guess-select" class="guess-select">
                            <option value="" disabled selected>-- בחר דמות לנחוש --</option>
                        </select>
                        <button id="guess-btn" class="action-btn danger-btn" onclick="window.submitGuess()">שלח ניחוש סופי!</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Result Screen -->
        <div class="game-section" id="result-section">
            <div id="result-message" class="result-box"></div>
            <br>
            <button class="action-btn" onclick="window.nextRound()">המשך לסבב הבא</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDBbK3k9yAXwWZn6iM3dDrg3nY3Y1uRXLk",
            authDomain: "nahesh-mi.firebaseapp.com",
            projectId: "nahesh-mi",
            storageBucket: "nahesh-mi.firebasestorage.app",
            messagingSenderId: "474265582061",
            appId: "1:474265582061:web:d21b525256d4c4b1ffcfe4",
            measurementId: "G-E268ELN03F",
            databaseURL: "https://nahesh-mi-default-rtdb.firebaseio.com"
        };

        let db, gameRef;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            gameRef = db.ref('guess_who_chat'); // עברנו לנתיב חדש כדי להתחיל נקי
        } catch (error) {
            alert("שגיאה בחיבור לפיירבייס: " + error.message);
        }

        const CHARACTERS = [
            { name: "אלכס", emoji: "👨🏻", traits: "שחור, שפם" },
            { name: "אניטה", emoji: "👱🏼‍♀️", traits: "בלונד, צמות" },
            { name: "ברנרד", emoji: "👨🏽‍🦱", traits: "חום, כובע" },
            { name: "צ'ארלס", emoji: "👱🏼‍♂️", traits: "בלונד, שפם" },
            { name: "קלייר", emoji: "👩🏻‍🦰", traits: "ג'ינג'י, משקפיים, כובע" },
            { name: "דויד", emoji: "👱🏼‍♂️", traits: "בלונד, זקן" },
            { name: "אריק", emoji: "👱🏼‍♂️", traits: "בלונד, כובע" },
            { name: "פראנס", emoji: "👨🏻‍🦰", traits: "ג'ינג'י" },
            { name: "ג'ורג'", emoji: "👴🏻", traits: "לבן, כובע" },
            { name: "הרמן", emoji: "👨🏻‍🦰", traits: "ג'ינג'י, קרחת" },
            { name: "ג'ו", emoji: "👱🏼‍♂️", traits: "בלונד, משקפיים" },
            { name: "מריה", emoji: "👩🏽", traits: "חום, כובע" },
            { name: "מקס", emoji: "👨🏻", traits: "שחור, שפם גדול" },
            { name: "פול", emoji: "👴🏻", traits: "לבן, משקפיים" },
            { name: "פיטר", emoji: "👴🏻", traits: "לבן, אף גדול" },
            { name: "פיליפ", emoji: "👨🏻", traits: "שחור, זקן חלקי" },
            { name: "ריצ'רד", emoji: "👨🏽", traits: "חום, זקן צרפתי" },
            { name: "רוברט", emoji: "👨🏽", traits: "חום, אף גדול" },
            { name: "סם", emoji: "👴🏻", traits: "לבן, משקפיים, קרחת" },
            { name: "סוזן", emoji: "👵🏻", traits: "לבן, שפתיים עבות" },
            { name: "טום", emoji: "👨🏻", traits: "שחור, משקפיים, קרחת" },
            { name: "ליאו", emoji: "👨🏽", traits: "חום, שפם עדין" },
            { name: "מייק", emoji: "👨🏽", traits: "חום, פנים רחבות" },
            { name: "נינה", emoji: "👱🏼‍♀️", traits: "בלונד, אף קטן" }
        ];

        let myRole = null;
        let gameState = null;
        let myChosenName = null;

        function showSection(sectionId) {
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function createCardHTML(char) {
            return `<div class="char-emoji">${char.emoji}</div>
                    <div class="char-name">${char.name}</div>
                    <div class="char-traits">${char.traits}</div>`;
        }

        function initChooseGrid() {
            const grid = document.getElementById('choose-grid');
            grid.innerHTML = '';
            CHARACTERS.forEach(char => {
                const div = document.createElement('div');
                div.className = 'character-card';
                div.innerHTML = createCardHTML(char);
                div.onclick = () => {
                    if(confirm(`האם לבחור ב-${char.name} כדמות המסתורית שלך?`)) {
                        myChosenName = char.name;
                        gameRef.child(myRole).update({ chosen: char.name });
                    }
                };
                grid.appendChild(div);
            });
        }

        function initPlayGrid() {
            const grid = document.getElementById('play-grid');
            const select = document.getElementById('guess-select');
            
            if (grid.innerHTML === '') {
                CHARACTERS.forEach(char => {
                    const div = document.createElement('div');
                    div.className = 'character-card';
                    div.innerHTML = createCardHTML(char);
                    div.onclick = function() {
                        // Allows crossing out characters ONLY if it's your turn
                        if (gameState && gameState.currentTurn === myRole) {
                            this.classList.toggle('eliminated');
                        } else {
                            alert("אתה יכול לפסול דמויות רק כשזה התור שלך!");
                        }
                    };
                    grid.appendChild(div);

                    const opt = document.createElement('option');
                    opt.value = char.name;
                    opt.textContent = char.name;
                    select.appendChild(opt);
                });
            }
        }

        window.joinGame = function(role) {
            myRole = role;
            document.getElementById('scoreboard').style.display = 'flex';
            
            gameRef.on('value', (snapshot) => {
                gameState = snapshot.val();
                if (!gameState) {
                    window.hardResetGame();
                    return;
                }
                updateUI();
                renderChat();
            });
        };

        // --- Chat & Turn Logic ---
        window.sendMessage = function() {
            if (gameState.currentTurn !== myRole) return;
            const input = document.getElementById('chat-text-input');
            const text = input.value.trim();
            if (!text) return;
            
            gameRef.child('messages').push({
                sender: myRole,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = '';
        };

        window.passTurn = function() {
            if (gameState.currentTurn !== myRole) return;
            const nextTurn = myRole === 'p1' ? 'p2' : 'p1';
            gameRef.update({ currentTurn: nextTurn });
        };

        // Allow 'Enter' key to send message
        document.getElementById('chat-text-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.sendMessage();
        });

        function renderChat() {
            const msgsDiv = document.getElementById('chat-messages');
            msgsDiv.innerHTML = '';
            
            if (gameState && gameState.messages) {
                Object.values(gameState.messages).forEach(msg => {
                    const div = document.createElement('div');
                    const isMine = msg.sender === myRole;
                    div.className = `message ${isMine ? 'mine' : 'theirs'}`;
                    div.innerText = msg.text;
                    msgsDiv.appendChild(div);
                });
                msgsDiv.scrollTop = msgsDiv.scrollHeight; // Auto-scroll to bottom
            }
        }

        window.submitGuess = function() {
            if (gameState.currentTurn !== myRole) {
                alert("אתה יכול לנחש רק בתור שלך!");
                return;
            }
            const guess = document.getElementById('guess-select').value;
            if (!guess) { alert("אנא בחר דמות מהרשימה!"); return; }

            if(confirm(`האם אתה בטוח שאתה רוצה לנחש שזה ${guess}? אם תטעה תפסיד בסבב!`)) {
                const opponentRole = myRole === 'p1' ? 'p2' : 'p1';
                const actualOpponentChar = gameState[opponentRole].chosen;
                
                let isCorrect = (guess === actualOpponentChar);
                let winnerRole = isCorrect ? myRole : opponentRole;
                let currentWinnerScore = gameState[winnerRole].score || 0;

                gameRef.update({
                    status: 'finished',
                    roundWinner: winnerRole,
                    correctChar: actualOpponentChar,
                    [`${winnerRole}/score`]: currentWinnerScore + 1
                });
            }
        };

        window.nextRound = function() {
            document.getElementById('play-grid').innerHTML = '';
            document.getElementById('guess-select').innerHTML = '<option value="" disabled selected>-- בחר דמות לנחוש --</option>';
            myChosenName = null;

            gameRef.update({
                status: 'choosing',
                roundWinner: null,
                correctChar: null,
                'p1/chosen': null,
                'p2/chosen': null,
                currentTurn: null,
                messages: null // Clear chat for next round
            });
        };

        window.hardResetGame = function() {
            gameRef.set({
                status: 'choosing',
                p1: { chosen: null, score: 0 },
                p2: { chosen: null, score: 0 },
                roundWinner: null,
                correctChar: null,
                currentTurn: null,
                messages: null
            });
            location.reload();
        };

        function updateUI() {
            if (!gameState) return;

            document.getElementById('p1-score-display').innerText = `שחקן 1: ${gameState.p1?.score || 0}`;
            document.getElementById('p2-score-display').innerText = `שחקן 2: ${gameState.p2?.score || 0}`;

            const status = gameState.status;
            const p1Chosen = gameState.p1?.chosen;
            const p2Chosen = gameState.p2?.chosen;

            if (status === 'choosing' && p1Chosen && p2Chosen) {
                if (myRole === 'p1') {
                    // Player 1 always starts the chatting phase
                    gameRef.update({ status: 'playing', currentTurn: 'p1', messages: null });
                }
                return;
            }

            if (status === 'choosing') {
                document.getElementById('round-display').innerText = "שלב בחירה";
                if (!gameState[myRole]?.chosen) {
                    initChooseGrid();
                    showSection('choose-section');
                } else {
                    document.getElementById('waiting-msg').innerText = "בחרת דמות! ממתין שהיריב יבחר...";
                    showSection('waiting-section');
                }
            } 
            else if (status === 'playing') {
                document.getElementById('round-display').innerText = "משחקים!";
                document.getElementById('my-chosen-display').innerText = `הדמות המסתורית שלך: ${gameState[myRole].chosen}`;
                initPlayGrid();
                
                // Turn Indicator Logic
                const isMyTurn = (gameState.currentTurn === myRole);
                const turnInd = document.getElementById('turn-indicator');
                
                // Toggle Chat Inputs & Action Buttons
                document.getElementById('chat-text-input').disabled = !isMyTurn;
                document.getElementById('chat-send-btn').disabled = !isMyTurn;
                document.getElementById('chat-pass-btn').disabled = !isMyTurn;
                document.getElementById('guess-select').disabled = !isMyTurn;
                document.getElementById('guess-btn').disabled = !isMyTurn;

                if (isMyTurn) {
                    turnInd.className = 'turn-indicator my-turn';
                    turnInd.innerText = '🎯 התור שלך! ענה ליריב, שאל שאלה והעבר תור.';
                } else {
                    turnInd.className = 'turn-indicator their-turn';
                    turnInd.innerText = '⏳ תור היריב. נא להמתין...';
                }

                showSection('playing-section');
            } 
            else if (status === 'finished') {
                document.getElementById('round-display').innerText = "סבב הסתיים";
                const resultDiv = document.getElementById('result-message');
                
                if (gameState.roundWinner === myRole) {
                    resultDiv.className = 'result-box win';
                    resultDiv.innerHTML = `🏆 ניצחת בסבב!<br>הדמות של היריב הייתה באמת <strong>${gameState.correctChar}</strong>.`;
                } else {
                    resultDiv.className = 'result-box lose';
                    resultDiv.innerHTML = `❌ הפסדת בסבב...<br>הדמות של היריב הייתה <strong>${gameState.correctChar}</strong>.`;
                }
                showSection('result-section');
            }
        }
    </script>
</body>
</html>
