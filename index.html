<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>טורניר "נחש מי" - מנהלים</title>
    <style>
        body { font-family: sans-serif; background: #1e3c72; color: #fff; padding: 20px; text-align: center; }
        .container { background: white; color: #333; padding: 20px; border-radius: 20px; max-width: 900px; margin: auto; }
        .card { border: 2px solid #ccc; padding: 10px; cursor: pointer; border-radius: 10px; display: inline-block; margin: 5px; width: 100px; }
        .spectator { background: #eee; border: 2px dashed #999; }
        .hidden { display: none; }
        .chat { height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; text-align: right; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="lobby">
        <h1>🏆 טורניר המנהלים 🏆</h1>
        <input type="text" id="room-code" placeholder="שם חדר למשחק...">
        <button onclick="joinRoom(false)">היכנס כשחקן</button>
        <button onclick="joinRoom(true)">צפה בחדר</button>
    </div>

    <div id="game-area" class="hidden">
        <h2 id="room-name"></h2>
        <div id="board-grid"></div>
        <div id="chat" class="chat"></div>
        <div id="controls">
            <input type="text" id="msg-input" placeholder="כתוב הודעה...">
            <button onclick="sendMessage()">שלח</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({ databaseURL: "https://nahesh-mi-default-rtdb.firebaseio.com" });
    const db = firebase.database();
    let isSpectator = false;
    let roomRef;

    function joinRoom(spectate) {
        const code = document.getElementById('room-code').value;
        if(!code) return alert("הכנס שם חדר");
        
        isSpectator = spectate;
        roomRef = db.ref('rooms/' + code);
        
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        
        // אם הוא צופה - ננטרל את כפתורי השליחה
        if(isSpectator) {
            document.getElementById('controls').classList.add('hidden');
        }

        // האזנה למשחק
        roomRef.on('value', s => {
            const data = s.val();
            // כאן נעדכן את הצ'אט והלוח בזמן אמת לכולם
            updateUI(data);
        });
    }

    function updateUI(data) {
        if(data && data.messages) {
            const chat = document.getElementById('chat');
            chat.innerHTML = Object.values(data.messages).map(m => `<p><b>${m.sender}:</b> ${m.text}</p>`).join('');
        }
    }

    function sendMessage() {
        if(isSpectator) return; // צופים לא יכולים לדבר
        const msg = document.getElementById('msg-input').value;
        roomRef.child('messages').push({sender: "מנהל", text: msg});
        document.getElementById('msg-input').value = '';
    }
</script>
</body>
</html>
