<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Who Game - Multiplayer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: ltr;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 30px; font-size: 2.5em; }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .characters-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px;
        }
        .character-btn {
            padding: 20px; border: 2px solid #ddd; background: #f5f5f5; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; font-size: 1em; font-weight: bold; white-space: pre-line;
        }
        .character-btn:hover { border-color: #667eea; background: #e8eaf6; transform: translateY(-5px); }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 10px; color: #333; font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: border-color 0.3s;
        }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        button.action-btn {
            width: 100%; padding: 12px; background: #667eea; color: white; border: none;
            border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px;
        }
        button.action-btn:hover { background: #764ba2; }
        .role-btn {
            margin: 10px; padding: 15px 30px; font-size: 1.2em; background: #ff7e5f; color: white;
            border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, background 0.2s;
        }
        .role-btn:hover { background: #feb47b; transform: scale(1.05); }
        .result { text-align: center; padding: 20px; margin-top: 20px; border-radius: 10px; font-size: 1.2em; font-weight: bold; }
        .result.win { background: #d4edda; color: #155724; }
        .result.lose { background: #f8d7da; color: #721c24; }
        .status-msg { font-size: 1.2em; color: #555; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Guess Who?</h1>
        
        <div class="game-section active" id="role-section">
            <h2>Select Your Role</h2>
            <button class="role-btn" onclick="window.joinGame('p1')">Join as Player 1 (Chooser)</button>
            <button class="role-btn" onclick="window.joinGame('p2')">Join as Player 2 (Guesser)</button>
        </div>

        <div class="game-section" id="player1-section">
            <h2>👤 Player 1: Choose a Character</h2>
            <div class="characters-grid" id="characters-grid"></div>
        </div>
        
        <div class="game-section" id="player2-section">
            <h2>🤔 Player 2: Guess the Character</h2>
            <div class="input-group">
                <label for="guess-input">Enter the character name:</label>
                <input type="text" id="guess-input" placeholder="e.g., Alice">
            </div>
            <button class="action-btn" onclick="window.submitGuess()">Submit Guess</button>
        </div>

        <div class="game-section" id="waiting-section">
            <h2 class="status-msg" id="waiting-msg">Waiting for the other player...</h2>
        </div>

        <div class="game-section" id="result-section">
            <div id="result" class="result"></div>
            <button class="action-btn" onclick="window.resetGame()">Play Again</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        // הבטחנו שהפונקציות זמינות לכפתורים
        const firebaseConfig = {
            apiKey: "AIzaSyDBbK3k9yAXwWZn6iM3dDrg3nY3Y1uRXLk",
            authDomain: "nahesh-mi.firebaseapp.com",
            projectId: "nahesh-mi",
            storageBucket: "nahesh-mi.firebasestorage.app",
            messagingSenderId: "474265582061",
            appId: "1:474265582061:web:d21b525256d4c4b1ffcfe4",
            measurementId: "G-E268ELN03F",
            // הוספתי את כתובת מסד הנתונים שכנראה הייתה חסרה
            databaseURL: "https://nahesh-mi-default-rtdb.firebaseio.com"
        };

        let db, gameRef;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            gameRef = db.ref('game_room');
            console.log("Firebase initialized successfully");
        } catch (error) {
            alert("שגיאה בחיבור לפיירבייס: " + error.message);
            console.error(error);
        }

        const CHARACTERS = [
            { id: 1, name: "Alice", hair: "black", eyes: "blue" },
            { id: 2, name: "Sarah", hair: "red", eyes: "green" },
            { id: 3, name: "Joseph", hair: "brown", eyes: "brown" },
            { id: 4, name: "Leah", hair: "blonde", eyes: "blue" },
            { id: 5, name: "David", hair: "gray", eyes: "gray" },
            { id: 6, name: "Rina", hair: "black", eyes: "brown" }
        ];

        let myRole = null;
        let globalGameState = null;

        function initGrid() {
            const grid = document.getElementById('characters-grid');
            grid.innerHTML = '';
            CHARACTERS.forEach(char => {
                const btn = document.createElement('button');
                btn.className = 'character-btn';
                btn.textContent = `${char.name}\n📍 Hair: ${char.hair}\n👀 Eyes: ${char.eyes}`;
                btn.onclick = () => window.selectCharacter(char);
                grid.appendChild(btn);
            });
        }

        function showSection(sectionId) {
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        window.joinGame = function(role) {
            console.log("Joining game as:", role);
            if (!gameRef) {
                alert("אין חיבור למסד הנתונים. אנא בדוק את הגדרות פיירבייס.");
                return;
            }
            myRole = role;
            initGrid();
            
            gameRef.on('value', (snapshot) => {
                const state = snapshot.val();
                if (!state) {
                    window.resetGame();
                    return;
                }
                globalGameState = state;
                updateUI();
            }, (error) => {
                alert("שגיאת הרשאות בפיירבייס. אנא ודא שה-Rules במסד הנתונים מאפשרים קריאה/כתיבה (true).");
                console.error(error);
            });
        };

        window.selectCharacter = function(char) {
            gameRef.set({
                status: 'guessing',
                chosenCharacter: char.name,
                winner: null
            });
        };

        window.submitGuess = function() {
            const guess = document.getElementById('guess-input').value.trim();
            if (!guess) {
                alert('❌ Please enter a name!');
                return;
            }
            const isCorrect = guess.toLowerCase() === globalGameState.chosenCharacter.toLowerCase();
            gameRef.set({
                status: 'finished',
                chosenCharacter: globalGameState.chosenCharacter,
                winner: isCorrect ? 'p2' : 'p1'
            });
            document.getElementById('guess-input').value = '';
        };

        window.resetGame = function() {
            gameRef.set({
                status: 'choosing',
                chosenCharacter: null,
                winner: null
            });
        };

        function updateUI() {
            if (!globalGameState) return;
            const status = globalGameState.status;

            if (status === 'choosing') {
                if (myRole === 'p1') {
                    showSection('player1-section');
                } else {
                    document.getElementById('waiting-msg').innerText = "Waiting for Player 1 to choose a character...";
                    showSection('waiting-section');
                }
            } 
            else if (status === 'guessing') {
                if (myRole === 'p2') {
                    showSection('player2-section');
                } else {
                    document.getElementById('waiting-msg').innerText = "Character locked! Waiting for Player 2 to guess...";
                    showSection('waiting-section');
                }
            } 
            else if (status === 'finished') {
                const resultDiv = document.getElementById('result');
                const charName = globalGameState.chosenCharacter;
                if (globalGameState.winner === 'p2') {
                    resultDiv.className = 'result win';
                    resultDiv.innerHTML = `🎉 Correct! It was <strong>${charName}</strong>!<br>🏆 Player 2 wins!`;
                } else {
                    resultDiv.className = 'result lose';
                    resultDiv.innerHTML = `❌ Wrong! It was <strong>${charName}</strong>.<br>🏆 Player 1 wins!`;
                }
                showSection('result-section');
            }
        }
    </script>
</body>
</html>
